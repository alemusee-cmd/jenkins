version: "3.8"

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        - COMMIT_SHA=5ae2efe
        - BUILD_NUMBER=1
    container_name: api-service
    networks:
      - app-network
    environment:
      - PORT=3000
    restart: always

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - COMMIT_SHA=5ae2efe
        - BUILD_NUMBER=1
    container_name: web-service
    ports:
      - "8080:8080"
    networks:
      - app-network
    environment:
      - PORT=8080
      - API_URL=http://api:3000
    depends_on:
      - api
    restart: always

networks:
  app-network:
    driver: bridge
